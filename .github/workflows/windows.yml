# Pedal Trinity - build Windows (VST3 + LV2 + Standalone con driver ASIO) e installer
name: Windows build

on:
  push:
    branches: [main-windows, dev-rack]
    tags: ["v*-windows"]
  pull_request:
    branches: [main-windows, dev-rack]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Steinberg ASIO SDK (GPLv3)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.steinberg.net/asiosdk" -OutFile asiosdk.zip
          Expand-Archive asiosdk.zip -DestinationPath asiosdk_raw
          $hdr = Get-ChildItem -Recurse asiosdk_raw -Filter iasiodrv.h | Select-Object -First 1
          $sdk = $hdr.Directory.Parent.FullName
          Write-Host "ASIO SDK: $sdk"
          Get-ChildItem $sdk
          "ASIO_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configura (JUCE 7.0.12, MSVC x64)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DPT_ASIO_SDK_DIR="${{ env.ASIO_SDK }}"

      - name: Compila
        run: cmake --build build --config Release --parallel

      - name: Autotest DSP
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build\PedalTrinity_artefacts\Release\Standalone\Pedal Trinity.exe" `
                             -ArgumentList "--selftest" -Wait -PassThru
          Write-Host "Codice di uscita autotest: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc packaging\windows\PedalTrinity.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Archivio portabile
        shell: pwsh
        run: |
          $dst = "portable\Pedal Trinity"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item -Recurse "build\PedalTrinity_artefacts\Release\VST3\Pedal Trinity.vst3" $dst
          Copy-Item -Recurse "build\PedalTrinity_artefacts\Release\LV2\Pedal Trinity.lv2" $dst
          Copy-Item "build\PedalTrinity_artefacts\Release\Standalone\Pedal Trinity.exe" $dst
          Copy-Item docs\PedalTrinity_Guida.pdf, LICENSE, README.md $dst
          Compress-Archive -Path "portable\Pedal Trinity" -DestinationPath "dist\PedalTrinity-1.0.0-beta-Windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: PedalTrinity-Windows
          path: dist/*

      - name: Pubblica release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/*
